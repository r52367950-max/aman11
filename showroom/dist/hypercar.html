    color-scheme: light;
    --ground: #e6e7ea;
    --ground-2: #dcdee2;
    --panel: rgba(255, 255, 255, 0.72);
    --panel-solid: #f4f5f7;

      --ink: #e9ecf1;
      --ink-2: #9aa4b1;
      --ink-3: #6b7480;
      --rule: rgba(233, 236, 241, 0.16);

      --accent: #4ad7c4;
      --accent-ink: #04211e;
      --bronze: #d3a05a;
      --hot: #ff5238;
      --shadow: 0 18px 50px -30px rgba(0, 0, 0, 0.9);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Plex Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: fixed; inset: 0; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #view.dragging { cursor: grabbing; }

  .eyebrow {
    font-family: 'Saira Condensed', 'Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ---- masthead -------------------------------------------------------- */
  .masthead {
    position: fixed;
    top: 0; left: 0;
    padding: 22px 26px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    pointer-events: none;
    z-index: 3;
  }
  .masthead h1 {
    margin: 0;
    font-family: 'Saira Condensed', 'Plex Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 4.6vw, 54px);
    line-height: 0.94;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  .masthead h1 em {
    font-style: normal;
    color: var(--accent);
  }
  .masthead .sub {
    font-size: 12px;
    color: var(--ink-2);
    letter-spacing: 0.04em;
    max-width: 30ch;
  }

  /* ---- control rail ---------------------------------------------------- */
  .rail {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 306px;
    z-index: 4;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border-left: 1px solid var(--rule);
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .rail section {
    padding: 16px 20px 18px;
    border-bottom: 1px solid var(--rule-soft);
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .rail section:last-child { border-bottom: 0; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sec-head b {
    font-family: 'Saira Condensed', 'Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.1em;
  }

  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }

  button {
    font: inherit;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 8px 6px;
    cursor: pointer;
    transition: color 0.16s, border-color 0.16s, background 0.16s;
  }
  button:hover { color: var(--ink); border-color: var(--ink-3); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed='true'] {
    color: var(--accent);
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 11%, transparent);
  }
  button .k {
    display: block;
    font-family: 'Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--ink-3);
    margin-top: 2px;
  }
  button[aria-pressed='true'] .k { color: inherit; opacity: 0.7; }

  .wide {
    width: 100%;
    padding: 9px;
    font-family: 'Saira Condensed', 'Plex Sans', sans-serif;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 13px;
  }
  .wide.primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .wide.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }

  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
  .swatch {
    position: relative;
    aspect-ratio: 1;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--rule);
    box-shadow: inset 0 -4px 8px -4px rgba(0, 0, 0, 0.7), inset 0 4px 6px -4px rgba(255, 255, 255, 0.55);
  }
  .swatch[aria-pressed='true'] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .swatch-name { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; }
  .swatch-name span:last-child { font-family: 'Plex Mono', monospace; font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
  .field label b { font-family: 'Plex Mono', monospace; font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type='range'] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    background: transparent;
    cursor: pointer;
  }
  input[type='range']::-webkit-slider-runnable-track { height: 2px; background: var(--rule); }
  input[type='range']::-moz-range-track { height: 2px; background: var(--rule); }
  input[type='range']::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px; height: 16px;
    margin-top: -7px;
    background: var(--accent);
    border: 0; border-radius: 1px;
  }
  input[type='range']::-moz-range-thumb {
    width: 8px; height: 16px;
    background: var(--accent);
    border: 0; border-radius: 1px;
  }
  input[type='range']:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---- telemetry ------------------------------------------------------- */
  .telemetry {
    position: fixed;
    left: 26px; bottom: 22px;
    z-index: 3;
    display: flex;
    gap: 26px;
    pointer-events: none;
  }
  .tel { display: flex; flex-direction: column; gap: 1px; }
  .tel .v {
    font-family: 'Plex Mono', monospace;
    font-size: 20px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .tel .v i { font-style: normal; font-size: 11px; color: var(--ink-3); margin-left: 3px; }
  .tel .l { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); font-family: 'Saira Condensed', sans-serif; font-weight: 600; }
  .tel.alert .v { color: var(--hot); }

  .hint {
    position: fixed;
    left: 26px; bottom: 96px;
    z-index: 3;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    pointer-events: none;
    transition: opacity 0.6s;
  }

  /* ---- loader ---------------------------------------------------------- */
  .loader {
    position: fixed; inset: 0; z-index: 10;
    background: var(--ground);
    display: grid; place-content: center; justify-items: center; gap: 14px;
    transition: opacity 0.7s ease;
  }
  .loader.done { opacity: 0; pointer-events: none; }
  .loader .bar { width: 190px; height: 2px; background: var(--rule); overflow: hidden; }
  .loader .bar i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }

  .fail { max-width: 46ch; text-align: center; color: var(--ink-2); font-size: 13px; }

  @media (prefers-reduced-motion: reduce) {
    .loader .bar i { animation: none; width: 100%; }
  }

  /* ---- narrow screens: rail becomes a bottom sheet ---------------------- */
  @media (max-width: 860px) {
    .rail {
      top: auto; left: 0; right: 0;
      width: auto;
      max-height: 52svh;
      border-left: 0;
      border-top: 1px solid var(--rule);
    }
    .masthead { padding: 16px 18px; }
    .telemetry { left: 18px; bottom: calc(52svh + 14px); gap: 18px; }
    .telemetry .tel:nth-child(n + 4) { display: none; }
    .hint { display: none; }
  }
</style>

<header class="masthead">
  <span class="eyebrow">Noctis Automobili · 实时三维展台</span>
  <h1>R1 <em>Prototipo</em></h1>

</header>

<div class="hint" id="hint">拖拽旋转视角 · 滚轮缩放 · 数字键 1–6 切换视图</div>

  <div class="tel"><span class="v" id="t-rpm">820<i>rpm</i></span><span class="l">转速 Engine</span></div>

</div>

<aside class="rail">
  <section>
    <div class="sec-head"><b>视角</b><span class="eyebrow">View</span></div>

    <div class="grid-2">
      <button id="tour" aria-pressed="false">六视巡览<span class="k">TOUR</span></button>
      <button id="shot">导出六视图<span class="k">EXPORT</span></button>
    </div>
  </section>

  <section>
    <div class="sec-head"><b>涂装</b><span class="eyebrow">Finish</span></div>
    <div class="swatches" id="paints"></div>
    <div class="swatch-name"><span id="paint-cn">极光青</span><span id="paint-en">AURORA TEAL</span></div>
  </section>

  <section>

      <button id="steer" aria-pressed="false">转向<span class="k">STEERING</span></button>
      <button id="lamps" aria-pressed="true">灯组<span class="k">LAMPS</span></button>
    </div>
  </section>

  <section>
    <div class="sec-head"><b>展台</b><span class="eyebrow">Studio</span></div>
    <div class="field">

      <input type="range" id="exposure" min="0.5" max="1.8" step="0.02" value="1" />
    </div>

      <button id="theme">切换环境<span class="k">LIGHT / DARK</span></button>
      <button id="reset">复位<span class="k">RESET</span></button>
    </div>
  </section>
</aside>

/* Small math toolkit shared by the surface builder and the animation loop. */
(function (global) {
  'use strict';

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (t) => {
    t = clamp(t, 0, 1);
    return t * t * (3 - 2 * t);
  };
  const smootherstep = (t) => {
    t = clamp(t, 0, 1);
    return t * t * t * (t * (t * 6 - 15) + 10);
  };

  /* Polynomial smooth maximum: blends the two branches over a window of k
     instead of creating the hard crease that Math.max would leave behind. */
  function smoothMax(a, b, k) {

    return lerp(a, b, h) + k * h * (1 - h);

     overshoots between control points, which shows up as phantom bulges in a
     car's width profile, so the body curves all go through this instead. */
  function pchip(points) {
    const p = points.slice().sort((a, b) => a[0] - b[0]);
    const n = p.length;
    const xs = new Float64Array(n);
    const ys = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      xs[i] = p[i][0];
      ys[i] = p[i][1];
    }
    const h = new Float64Array(n - 1);
    const d = new Float64Array(n - 1);
    for (let i = 0; i < n - 1; i++) {
      h[i] = xs[i + 1] - xs[i];
      d[i] = (ys[i + 1] - ys[i]) / h[i];
    }
    const m = new Float64Array(n);
    m[0] = d[0];
    m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) {
      if (d[i - 1] * d[i] <= 0) {
        m[i] = 0;
      } else {
        const w1 = 2 * h[i] + h[i - 1];
        const w2 = h[i] + 2 * h[i - 1];
        m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
      }
    }
    return function (x) {
      if (x <= xs[0]) return ys[0];
      if (x >= xs[n - 1]) return ys[n - 1];
      let lo = 0;
      let hi = n - 1;
      while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (xs[mid] > x) hi = mid;
        else lo = mid;
      }
      const t = (x - xs[lo]) / h[lo];
      const t2 = t * t;
      const t3 = t2 * t;

      const h10 = t3 - 2 * t2 + t;

     walks past the quadrant boundary (needed for finite-difference normals). */

/* Every texture in the showroom is drawn at runtime on a 2D canvas: no image
   files, so the whole scene stays inside one HTML document. */
(function (global) {
  'use strict';

  const { mulberry32, clamp } = MX;

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  function toTexture(THREE, cv, { repeat = [1, 1], srgb = false, aniso = 8 } = {}) {
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(repeat[0], repeat[1]);
    tex.anisotropy = aniso;

  /* Sobel filter over a greyscale height canvas -> tangent-space normal map. */
  function heightToNormal(THREE, heightCanvas, strength) {
    const w = heightCanvas.width;
    const h = heightCanvas.height;

    const out = canvas(w, h);
    const ctx = out.getContext('2d');
    const img = ctx.createImageData(w, h);
    const at = (x, y) => src[((((y + h) % h) * w + ((x + w) % w)) << 2)] / 255;

      for (let x = 0; x < w; x++) {
        const tl = at(x - 1, y - 1);
        const t = at(x, y - 1);
        const tr = at(x + 1, y - 1);
        const l = at(x - 1, y);
        const r = at(x + 1, y);
        const bl = at(x - 1, y + 1);
        const b = at(x, y + 1);
        const br = at(x + 1, y + 1);
        const dx = tl + 2 * l + bl - (tr + 2 * r + br);
        const dy = tl + 2 * t + tr - (bl + 2 * b + br);
        let nx = dx * strength;
        let ny = dy * strength;
        const nz = 1;
        const len = Math.hypot(nx, ny, nz);
        nx /= len;
        ny /= len;
        const i = (y * w + x) << 2;
        img.data[i] = (nx * 0.5 + 0.5) * 255;
        img.data[i + 1] = (ny * 0.5 + 0.5) * 255;
        img.data[i + 2] = (nz / len) * 255;

        gh.addColorStop(0.5, '#e8e8e8');
        gh.addColorStop(1, '#101010');
        hc.fillStyle = gh;
        hc.fillRect(x, y, s, s);

        // individual filaments running along the tow
        cc.save();
        cc.beginPath();
        cc.rect(x, y, s, s);
        cc.clip();
        cc.globalAlpha = 0.28;
        cc.strokeStyle = '#000';
        cc.lineWidth = 0.7;
        for (let k = 1; k < 7; k++) {
          const o = (k / 7) * s;
          cc.beginPath();
          if (warp) {
            cc.moveTo(x, y + o);
            cc.lineTo(x + s, y + o);
          } else {
            cc.moveTo(x + o, y);
            cc.lineTo(x + o, y + s);
          }
          cc.stroke();
        }
        cc.restore();
      }
    }
    return { color: col, height: hgt };
  }

  /* --- metallic paint flake ---------------------------------------------- */
  function flakeHeight(size = 256, seed = 7) {
    const cv = canvas(size, size);
    const ctx = cv.getContext('2d');
    const rnd = mulberry32(seed);
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, size, size);
    const img = ctx.getImageData(0, 0, size, size);
    for (let i = 0; i < size * size; i++) {
      const v = 128 + (rnd() - 0.5) * 150;
      const k = i << 2;
      img.data[k] = img.data[k + 1] = img.data[k + 2] = v;
      img.data[k + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return cv;
  }

  /* --- tyre: tread blocks on the crown, ribbed sidewalls ----------------- */
  function tyreCanvases(w = 1024, h = 512) {
    const col = canvas(w, h);
    const hgt = canvas(w, h);
    const rgh = canvas(w, h);
    const cc = col.getContext('2d');
    const hc = hgt.getContext('2d');
    const rc = rgh.getContext('2d');
    cc.fillStyle = '#0a0a0b';
    cc.fillRect(0, 0, w, h);
    hc.fillStyle = '#9a9a9a';
    hc.fillRect(0, 0, w, h);
    rc.fillStyle = '#c9c9c9'; // crown: matte
    rc.fillRect(0, 0, w, h);

    // sidewalls sit either side of the crown band and read glossier than tread
    const sideBands = [[0.1, 0.33], [0.67, 0.9]];
    sideBands.forEach(([a, b]) => {
      rc.fillStyle = '#8f8f8f';
      rc.fillRect(0, a * h, w, (b - a) * h);
      cc.fillStyle = '#0d0d0f';
      cc.fillRect(0, a * h, w, (b - a) * h);
      // concentric moulding ribs
      for (let y = a * h; y < b * h; y += 5) {
        hc.fillStyle = ((y / 5) | 0) % 2 ? '#a6a6a6' : '#8e8e8e';
        hc.fillRect(0, y, w, 3);
      }
      // shoulder lettering block, kept abstract
      cc.save();
      cc.globalAlpha = 0.5;
      cc.fillStyle = '#3a3a3e';
      const ty = (a + (b - a) * 0.45) * h;
      for (let x = 0; x < w; x += 128) {
        cc.fillRect(x + 18, ty, 62, 7);
        cc.fillRect(x + 88, ty, 26, 7);
      }
      cc.restore();
    });

    // crown: four circumferential grooves plus angled sipes
    const c0 = 0.33 * h;
    const c1 = 0.67 * h;
    hc.fillStyle = '#9a9a9a';
    hc.fillRect(0, c0, w, c1 - c0);
    [0.4, 0.5, 0.6].forEach((p) => {
      hc.fillStyle = '#2b2b2b';
      hc.fillRect(0, p * h - 6, w, 12);
      cc.fillStyle = '#050506';
      cc.fillRect(0, p * h - 6, w, 12);
    });
    hc.strokeStyle = '#2f2f2f';
    cc.strokeStyle = '#060607';
    hc.lineWidth = 7;
    cc.lineWidth = 7;
    for (let x = 0; x < w; x += 26) {
      hc.beginPath();
      hc.moveTo(x, c0);
      hc.lineTo(x + 22, c1);
      hc.stroke();
      cc.beginPath();
      cc.moveTo(x, c0);
      cc.lineTo(x + 22, c1);
      cc.stroke();
    }
    return { color: col, height: hgt, roughness: rgh };
  }

  /* --- honeycomb mesh used behind the intakes ---------------------------- */
  function honeycombCanvas(size = 512, r = 16) {
    const cv = canvas(size, size);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#050506';
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = '#2e3036';
    ctx.lineWidth = 2.4;
    const dx = r * Math.sqrt(3);
    const dy = r * 1.5;
    for (let row = -1; row * dy < size + r; row++) {
      for (let colI = -1; colI * dx < size + r; colI++) {
        const cx = colI * dx + (row % 2 ? dx / 2 : 0);
        const cy = row * dy;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = (Math.PI / 3) * k + Math.PI / 6;
          const px = cx + r * 0.94 * Math.cos(a);
          const py = cy + r * 0.94 * Math.sin(a);
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }
    }
    return cv;
  }

  /* --- brake rotor: drilled and slotted ---------------------------------- */
  function rotorCanvas(size = 512) {
    const cv = canvas(size, size);
    const ctx = cv.getContext('2d');
    const c = size / 2;
    ctx.fillStyle = '#101013';
    ctx.fillRect(0, 0, size, size);
    const g = ctx.createRadialGradient(c, c, size * 0.16, c, c, size * 0.5);
    g.addColorStop(0, '#26262b');
    g.addColorStop(0.42, '#3a3b41');
    g.addColorStop(0.94, '#4a4b52');
    g.addColorStop(1, '#1b1c20');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(c, c, size * 0.5, 0, Math.PI * 2);
    ctx.fill();
    // turned finish
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#000';
    for (let r = size * 0.2; r < size * 0.5; r += 2.2) {
      ctx.beginPath();
      ctx.arc(c, c, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // curved slots
    ctx.strokeStyle = '#0b0b0d';
    ctx.lineWidth = 6;
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(c, c, size * 0.36, a, a + 0.5);
      ctx.stroke();
    }
    // drilled holes
    ctx.fillStyle = '#08080a';
    for (let ring = 0; ring < 3; ring++) {
      const rr = size * (0.26 + ring * 0.07);
      const n = 16 + ring * 6;
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2 + ring * 0.2;
        ctx.beginPath();
        ctx.arc(c + rr * Math.cos(a), c + rr * Math.sin(a), size * 0.011, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // hub shadow
    ctx.fillStyle = '#0d0d10';
    ctx.beginPath();
    ctx.arc(c, c, size * 0.19, 0, Math.PI * 2);
    ctx.fill();
    return cv;
  }

  /* --- studio floor and cyclorama --------------------------------------- */
  function floorCanvas(size, inner, outer) {
    const cv = canvas(size, size);
    const ctx = cv.getContext('2d');
    const c = size / 2;
    ctx.fillStyle = outer;
    ctx.fillRect(0, 0, size, size);
    const g = ctx.createRadialGradient(c, c, 0, c, c, c);
    g.addColorStop(0, inner);
    g.addColorStop(0.35, inner);
    g.addColorStop(1, outer);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return cv;
  }

  function backdropCanvas(bottom, top, hold) {
    const cv = canvas(4, 512);
    const ctx = cv.getContext('2d');
    const g = ctx.createLinearGradient(0, 512, 0, 0);
    g.addColorStop(0, bottom);
    g.addColorStop(hold === undefined ? 0.42 : hold, bottom);
    g.addColorStop(1, top);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 4, 512);
    return cv;
  }

  /* --- soft contact shadow ---------------------------------------------- */
  function blobCanvas(size = 512) {
    const cv = canvas(size, size);
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    const draw = (cx, cy, rx, ry, a) => {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(rx, ry);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      g.addColorStop(0, `rgba(0,0,0,${a})`);
      g.addColorStop(0.55, `rgba(0,0,0,${a * 0.55})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    };
    const c = size / 2;
    draw(c, c, size * 0.47, size * 0.26, 0.5);
    draw(c, c * 0.72, size * 0.2, size * 0.11, 0.42);
    draw(c, c * 1.3, size * 0.22, size * 0.12, 0.42);
    return cv;
  }

  /* --- headlight / tail lamp inner optic --------------------------------- */
  function lampCanvas(w = 256, h = 64, tint = '#ff2a2a') {
    const cv = canvas(w, h);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#000');
    g.addColorStop(0.34, tint);
    g.addColorStop(0.66, tint);
    g.addColorStop(1, '#000');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#000';
    for (let x = 0; x < w; x += 8) ctx.fillRect(x, 0, 2.5, h);
    return cv;
  }

  global.TX = {
    canvas,
    toTexture,
    heightToNormal,
    carbonCanvases,
    flakeHeight,
    tyreCanvases,
    honeycombCanvas,
    rotorCanvas,
    floorCanvas,
    backdropCanvas,
    blobCanvas,
    lampCanvas,
    clamp,
  };
})(window);

</script>
<script>
/* ---------------------------------------------------------------------------
   The body is one lofted surface, not a pile of boxes.

   Every cross-section is a superellipse whose width, height, centre and
   exponent are driven by monotone splines along the length of the car. The
   lower edge of each section is clipped at a "bottom line" that swells over
   the wheel centres, which is what carves the wheel arches: the skin simply
   stops existing below the arch curve. Surface sculpting (side intakes, bonnet
   channel, haunch waist) is applied as smooth dents along the section normal,
   so trims and glass generated from the same surface stay glued to it.

   Axes: +X points at the nose, +Y is up, +Z is the right-hand side.
--------------------------------------------------------------------------- */
(function (global) {
  'use strict';

  const { pchip, clamp, lerp, smoothMax, spow, bump, HALF_PI } = MX;

  const SPEC = {
    length: 4.72,
    width: 2.064,
    height: 1.145,
    wheelbase: 2.72,
    frontAxle: 1.36,
    rearAxle: -1.36,
    noseX: 2.36,
    tailX: -2.36,
    front: { radius: 0.362, halfWidth: 0.155, track: 0.822 },
    rear: { radius: 0.382, halfWidth: 0.195, track: 0.822 },
  };

  const ARCHES = [
    { x: SPEC.frontAxle, r: 0.386, cy: SPEC.front.radius + 0.008 },
    { x: SPEC.rearAxle, r: 0.406, cy: SPEC.rear.radius + 0.008 },
  ];

  const topY = pchip([
    [2.36, 0.455], [2.30, 0.52], [2.20, 0.60], [2.05, 0.672], [1.85, 0.742],
    [1.62, 0.795], [1.45, 0.826], [1.30, 0.843], [1.10, 0.848], [0.92, 0.842],
    [0.78, 0.852], [0.62, 0.912], [0.42, 1.002], [0.18, 1.079], [-0.10, 1.128],
    [-0.38, 1.145], [-0.62, 1.136], [-0.85, 1.096], [-1.05, 1.032], [-1.25, 0.992],
    [-1.50, 0.972], [-1.80, 0.962], [-2.05, 0.944], [-2.25, 0.918], [-2.36, 0.878],
  ]);

  const halfW = pchip([
    [2.36, 0.09], [2.30, 0.245], [2.22, 0.4], [2.10, 0.56], [1.95, 0.7],
    [1.78, 0.83], [1.60, 0.928], [1.45, 0.99], [1.36, 1.018], [1.26, 1.031],
    [1.1, 1.02], [0.95, 0.988], [0.70, 0.951], [0.35, 0.929], [0.00, 0.926],
    [-0.35, 0.939], [-0.70, 0.969], [-1.00, 1.006], [-1.22, 1.028], [-1.36, 1.032],
    [-1.55, 1.024], [-1.85, 0.985], [-2.1, 0.936], [-2.28, 0.892], [-2.36, 0.858],
  ]);

  const midY = pchip([
    [2.36, 0.30], [2.10, 0.39], [1.75, 0.51], [1.45, 0.60], [1.36, 0.62],
    [1.15, 0.60], [0.90, 0.585], [0.50, 0.60], [0.00, 0.63], [-0.60, 0.65],
    [-1.05, 0.665], [-1.36, 0.68], [-1.70, 0.66], [-2.05, 0.62], [-2.36, 0.60],
  ]);

  const lowY = pchip([
    [2.36, 0.06], [1.90, 0.05], [1.36, 0.055], [0.50, 0.075], [0.00, 0.085],
    [-0.80, 0.085], [-1.36, 0.075], [-1.90, 0.10], [-2.36, 0.16],
  ]);

  /* Shoulder fullness. Cranked up over the axles so the fenders read as
     haunches wrapping the wheels rather than a smooth tube. */
  const nUp = pchip([
    [2.36, 2.6], [2.10, 3.0], [1.85, 3.6], [1.62, 4.2], [1.45, 4.7],
    [1.36, 4.9], [1.18, 4.6], [1.00, 3.9], [0.60, 3.4], [0.20, 3.1],
    [-0.30, 3.0], [-0.80, 3.3], [-1.15, 4.4], [-1.36, 5.0], [-1.60, 4.8],
    [-1.90, 4.0], [-2.15, 3.8], [-2.36, 3.8],
  ]);

  const nDn = pchip([
    [2.36, 2.2], [1.60, 2.6], [0.60, 3.0], [-0.60, 3.0], [-1.60, 2.8], [-2.36, 2.6],
  ]);

  const rocker = pchip([
    [2.36, 0.075], [2.00, 0.075], [1.75, 0.10], [1.45, 0.16], [1.00, 0.205],
    [0.00, 0.216], [-1.00, 0.205], [-1.50, 0.18], [-1.90, 0.225], [-2.15, 0.31],
    [-2.36, 0.365],
  ]);

  /* Beltline, expressed as a drop below the roof line so the canopy keeps a
     constant visual depth as the roof rises and falls. A negative drop pushes
     the line above the body, which pinches the glass shut at both ends. */
  const beltDrop = pchip([
    [0.72, -0.06], [0.62, 0.02], [0.48, 0.1], [0.2, 0.155], [-0.2, 0.178],
    [-0.5, 0.172], [-0.72, 0.135], [-0.88, 0.07], [-1.02, -0.06],
  ]);
  const beltY = (x) => topY(x) - beltDrop(x);

  /* Surface sculpting. th is the section angle: -1.0 is deep under the flank,
     0 sits on the widest line, PI/2 is the centreline of the roof. */
  const DENTS = [
    { x: -0.60, rx: 0.72, th: 0.14, rth: 0.60, d: 0.105 }, // side intake mouth
    { x: -0.74, rx: 0.55, th: -0.44, rth: 0.34, d: 0.045 }, // lower intake blade
    { x: 0.34, rx: 0.88, th: -0.30, rth: 0.48, d: 0.032 }, // door scallop
    { x: 1.93, rx: 0.32, th: -0.32, rth: 0.48, d: 0.055 }, // bumper corner vent
    { x: 1.60, rx: 0.56, th: 1.45, rth: 0.36, d: 0.042 }, // bonnet channel
    { x: 2.14, rx: 0.34, th: 1.40, rth: 0.42, d: 0.018 }, // nose vee
    { x: -0.55, rx: 0.42, th: 1.52, rth: 0.22, d: 0.026 }, // roof duct
    { x: -1.32, rx: 0.46, th: 1.33, rth: 0.44, d: 0.034 }, // engine deck dip
    { x: -1.80, rx: 0.56, th: 0.10, rth: 0.46, d: 0.026 }, // rear haunch waist
    { x: 0.95, rx: 0.30, th: 0.42, rth: 0.26, d: 0.022 }, // fender exit vent
    { x: 2.18, rx: 0.30, th: -0.55, rth: 0.55, d: 0.05 }, // front mouth
    // character lines: shallow creases that break up the reflections the way
    // a real pressed panel does
    { x: 0.2, rx: 1.5, th: 0.5, rth: 0.1, d: 0.013, slope: 0.1 }, // shoulder
    { x: 0.5, rx: 1.3, th: -0.5, rth: 0.12, d: 0.01, slope: 0.05 }, // lower flank
    { x: 1.35, rx: 0.75, th: 1.05, rth: 0.16, d: 0.016, slope: 0.32 }, // bonnet edge
  ];

  function bottomEdge(x) {
    let y = rocker(x);
    for (let i = 0; i < ARCHES.length; i++) {
      const a = ARCHES[i];
      const dx = x - a.x;
      const inside = a.r * a.r - dx * dx;
      const arc = inside > 0
        ? a.cy + Math.sqrt(inside)
        : a.cy - (Math.abs(dx) - a.r) * 2.6;
      y = smoothMax(y, arc, 0.085);
    }
    return y;
  }

  function evalRaw(x, th, out) {
    const w = halfW(x);
    const yc = midY(x);
    const s = Math.sin(th);
    const c = Math.cos(th);
    if (s >= 0) {
      const e = 2 / nUp(x);
      out.y = yc + (topY(x) - yc) * Math.pow(s, e);
      out.z = w * spow(c, e);
    } else {
      const e = 2 / nDn(x);
      out.y = yc - (yc - lowY(x)) * Math.pow(-s, e);
      out.z = w * spow(c, e);
    }
    return out;
  }

  function dentDepth(x, th) {
    let d = 0;
    for (let i = 0; i < DENTS.length; i++) {
      const t = DENTS[i];
      const bx = bump((x - t.x) / t.rx);
      if (bx === 0) continue;
      const c = t.slope ? t.th + t.slope * (x - t.x) : t.th;
      d += t.d * bx * bump((th - c) / t.rth);
    }
    return d;
  }

  const _a = { y: 0, z: 0 };
  const _b = { y: 0, z: 0 };

  /* Point on the right half of the section, dents included. */
  function evalSection(x, th, out) {
    out = out || { y: 0, z: 0, ny: 0, nz: 0 };
    evalRaw(x, th, out);
    const h = 0.004;
    evalRaw(x, th - h, _a);
    evalRaw(x, th + h, _b);
    const tz = _b.z - _a.z;
    const ty = _b.y - _a.y;
    const len = Math.hypot(tz, ty) || 1;
    out.nz = ty / len;
    out.ny = -tz / len;
    const d = dentDepth(x, th);
    if (d > 1e-6) {
      out.y -= out.ny * d;
      out.z -= out.nz * d;
    }
    return out;
  }

  /* Section angle where the skin stops (the arch / rocker line). */
  function thetaMin(x) {
    const yc = midY(x);
    const yb = bottomEdge(x);
    if (yb >= yc) {
      const s = Math.pow(clamp((yb - yc) / (topY(x) - yc), 0, 1), nUp(x) / 2);
      return Math.asin(clamp(s, 0, 0.9995));
    }
    const s = Math.pow(clamp((yc - yb) / (yc - lowY(x)), 0, 1), nDn(x) / 2);
    return -Math.asin(clamp(s, 0, 0.9995));
  }

  function thetaAtHeight(x, y) {
    const yc = midY(x);
    if (y >= yc) {
      const s = Math.pow(clamp((y - yc) / (topY(x) - yc), 0, 1), nUp(x) / 2);
      return Math.asin(clamp(s, 0, 1));
    }
    const s = Math.pow(clamp((yc - y) / (yc - lowY(x)), 0, 1), nDn(x) / 2);
    return -Math.asin(clamp(s, 0, 1));
  }

  /* Ring coordinate q: 0 on the roof centreline, +-1 at the bottom edge. */
  function qFromTheta(x, th) {
    const t0 = thetaMin(x);
    return clamp((HALF_PI - th) / (HALF_PI - t0), 0, 1);
  }
  function thetaFromQ(x, q) {
    const t0 = thetaMin(x);
    return HALF_PI - (HALF_PI - t0) * Math.abs(q);
  }
  function qAtHeight(x, y) {
    return qFromTheta(x, thetaAtHeight(x, y));
  }

  const _p = { y: 0, z: 0, ny: 0, nz: 0 };

  /* World-space point at ring coordinate q, pushed out along the surface
     normal by `off` metres (used to lay trims and glass onto the skin). */
  function surfacePoint(x, q, off, target) {
    const th = thetaFromQ(x, q);
    evalSection(x, th, _p);
    const side = q < 0 ? -1 : 1;
    const o = off || 0;
    target[0] = x;
    target[1] = _p.y + _p.ny * o;
    target[2] = (_p.z + _p.nz * o) * side;
    return target;
  }

  function halfRingLength(x) {
    const t0 = thetaMin(x);
    const K = 96;
    let len = 0;
    let pz = 0;
    let py = 0;
    for (let i = 0; i <= K; i++) {
      const th = t0 + (HALF_PI - t0) * (i / K);
      evalSection(x, th, _p);
      if (i) len += Math.hypot(_p.z - pz, _p.y - py);
      pz = _p.z;
      py = _p.y;
    }
    return len;
  }

  /* Resample one half-section at equal arc length, so the mesh keeps a even
     density from the rocker up to the roof no matter how the section changes. */
  function halfRing(x, nh) {
    const t0 = thetaMin(x);
    const K = 220;
    const zs = new Float64Array(K + 1);
    const ys = new Float64Array(K + 1);
    const cum = new Float64Array(K + 1);
    for (let i = 0; i <= K; i++) {
      evalSection(x, t0 + (HALF_PI - t0) * (i / K), _p);
      zs[i] = _p.z;
      ys[i] = _p.y;
      if (i) cum[i] = cum[i - 1] + Math.hypot(zs[i] - zs[i - 1], ys[i] - ys[i - 1]);
    }
    const total = cum[K] || 1;
    const out = new Float64Array(nh * 2);
    let j = 0;

  /* Region helper: a lens-shaped patch on the flank between two height

  function heightRegion(yTop, yBot, x0, x1, soft) {
    const pinch = (x) => {
      const d = Math.min(Math.abs(x - x0), Math.abs(x - x1));
      return MX.smoothstep(d / soft);
    };
    return {
      lo: (x) => {
        const a = B.qAtHeight(x, yTop(x));
        const b = B.qAtHeight(x, yBot(x));
        const mid = (a + b) / 2;
        return mid + (a - mid) * pinch(x);
      },
      hi: (x) => {
        const a = B.qAtHeight(x, yTop(x));
        const b = B.qAtHeight(x, yBot(x));
        const mid = (a + b) / 2;
        return mid + (b - mid) * pinch(x);
      },
    };
  }

  function sidePanels(THREE, opts) {

    const right = B.buildPatch(THREE, {
      x0: opts.x0,
      x1: opts.x1,
      nx: opts.nx || 60,
      nv: opts.nv || 18,
      qLo: r.lo,
      qHi: r.hi,
      offset: off,
    });

      x0: opts.x0,
      x1: opts.x1,
      nx: opts.nx || 60,
      nv: opts.nv || 18,
      qLo: (x) => -r.hi(x),
      qHi: (x) => -r.lo(x),
      offset: (fx, fv) => off(fx, 1 - fv),

  /* Panel shut lines. A car reads as sheet metal because of its gaps, so each
     seam is a hairline ribbon laid on the surface and followed in arc-length
     space, which keeps it an even width as the section changes. */
  function seam(THREE, waypoints, width, samples) {
    const n = samples || 120;
    const half = (width || 0.0055) / 2;
    const at = (t) => {
      const f = t * (waypoints.length - 1);
      const i = Math.min(waypoints.length - 2, Math.floor(f));
      const u = f - i;
      const a = waypoints[i];
      const b = waypoints[i + 1];
      // smooth the corners so the ribbon does not kink
      const e = u * u * (3 - 2 * u);
      return [lerp(a[0], b[0], e), lerp(a[1], b[1], e)];
    };
    const rows = [];
    const tmp = [0, 0, 0];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const p = at(t);
      const p0 = at(Math.max(0, t - 0.004));
      const p1 = at(Math.min(1, t + 0.004));

      let da = (p1[1] - p0[1]) * L;

      da /= len;

      const pa = dx * half;

        row.push([tmp[0], tmp[1], tmp[2]]);

      housing.translate(tip[0] - 0.012, tip[1] + 0.022, tip[2] + side * 0.014);
      add(housing, mats.carbon);
      const glassM = new THREE.CircleGeometry(0.036, 18);
      glassM.rotateY(Math.PI * 0.92);
      glassM.scale(1, 0.7, 1);
      glassM.translate(tip[0] - 0.082, tip[1] + 0.022, tip[2] + side * 0.014);
      add(glassM, mats.mirror, false);
    });

    /* --- roof fin --------------------------------------------------------- */
    const finOutline = [
      [-0.78, 1.108], [-1.02, 1.11], [-1.32, 1.06], [-1.55, 0.99], [-1.55, 0.965],
      [-1.3, 1.005], [-1.0, 1.05], [-0.78, 1.06],
    ];
    add(P.vplate(THREE, finOutline, 0.024, 0), mats.carbon);

    /* --- rear wing -------------------------------------------------------- */
    const wing = new THREE.Group();
    wing.position.set(-2.03, 1.115, 0);
    chassis.add(wing);

    // NACA-style inverted section: round leading edge forward, sharp trailing
    // edge aft, camber curving down so it reads as a downforce element.
    const chord = 0.32;
    const airfoil = new THREE.Shape();
    const upper = [];
    const lower = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16;
      const th =
        5 * 0.12 * (0.2969 * Math.sqrt(t) - 0.126 * t - 0.3516 * t * t + 0.2843 * t * t * t - 0.1015 * t * t * t * t);
      const cm = -0.055 * 4 * t * (1 - t);
      const px = chord * (0.5 - t);
      upper.push([px, (cm + th) * chord]);
      lower.push([px, (cm - th) * chord]);
    }
    upper.forEach((p, i) => (i === 0 ? airfoil.moveTo(p[0], p[1]) : airfoil.lineTo(p[0], p[1])));
    for (let i = lower.length - 1; i >= 0; i--) airfoil.lineTo(lower[i][0], lower[i][1]);
    airfoil.closePath();

    const span = 1.58;
    const wingGeo = new THREE.ExtrudeGeometry(airfoil, {
      depth: span,
      bevelEnabled: false,
      curveSegments: 3,
    });
    wingGeo.translate(0, 0, -span / 2);
    const wingMesh = new THREE.Mesh(wingGeo, mats.carbonFine);
    wingMesh.castShadow = true;
    wing.add(wingMesh);

    // endplates: tall at the front, swept away at the back
    [1, -1].forEach((side) => {
      const plate = P.vplate(
        THREE,
        [
          [0.18, -0.055], [0.185, 0.045], [0.12, 0.072], [-0.02, 0.062], [-0.12, 0.01],
          [-0.135, -0.05], [-0.09, -0.085], [0.06, -0.092],
        ],
        0.016,
        side * (span / 2 + 0.008)
      );
      const m = new THREE.Mesh(plate, mats.carbonFine);
      m.castShadow = true;
      wing.add(m);
    });

    // swan-neck struts: they hang the wing from above, clear of the suction side
    [1, -1].forEach((side) => {
      const outline = [
        [0.07, -0.012], [0.025, -0.075], [-0.025, -0.135], [-0.06, -0.175],
        [-0.005, -0.183], [0.035, -0.14], [0.085, -0.08], [0.125, -0.014],
      ];
      const m = new THREE.Mesh(P.vplate(THREE, outline, 0.028, side * 0.4), mats.carbonFine);
      m.castShadow = true;
      wing.add(m);
    });

    /* --- shut lines -------------------------------------------------------- */
    const seams = [];
    // bonnet, wrapping over the centreline at the cowl
    seams.push(
      seam(THREE, [
        [1.99, 0.46], [1.72, 0.42], [1.4, 0.37], [1.1, 0.3], [0.9, 0.19],
        [0.79, 0.07], [0.76, 0.0], [0.79, -0.07], [0.9, -0.19], [1.1, -0.3],
        [1.4, -0.37], [1.72, -0.42], [1.99, -0.46],
      ])
    );
    // door cuts, front and rear, on both flanks
    [1, -1].forEach((side) => {
      seams.push(
        seam(THREE, [
          [0.74, side * 0.28], [0.71, side * 0.45], [0.68, side * 0.66],
          [0.66, side * 0.85], [0.66, side * 0.99],
        ], 0.0055, 60)
      );
      seams.push(
        seam(THREE, [
          [-0.4, side * 0.3], [-0.44, side * 0.5], [-0.5, side * 0.72],
          [-0.56, side * 0.9], [-0.6, side * 0.99],
        ], 0.0055, 60)
      );
    });
    // engine cover, front edge and rear edge
    seams.push(
      seam(THREE, [
        [-0.98, 0.44], [-1.0, 0.3], [-1.02, 0.12], [-1.03, 0.0], [-1.02, -0.12],
        [-1.0, -0.3], [-0.98, -0.44],
      ], 0.0055, 80)
    );
    seams.push(
      seam(THREE, [
        [-1.72, 0.4], [-1.74, 0.24], [-1.75, 0.08], [-1.75, -0.08], [-1.74, -0.24],
        [-1.72, -0.4],
      ], 0.0055, 80)
    );
    add(P.mergeGeos(THREE, seams), mats.gap, false);

    /* --- wheels ----------------------------------------------------------- */
    const wheels = [];
    const layout = [
      { x: S.frontAxle, z: S.front.track, size: S.front, steer: true },
      { x: S.frontAxle, z: -S.front.track, size: S.front, steer: true },
      { x: S.rearAxle, z: S.rear.track, size: S.rear, steer: false },
      { x: S.rearAxle, z: -S.rear.track, size: S.rear, steer: false },
    ];
    layout.forEach((w) => {
      const built = P.buildWheel(THREE, mats, w.size);
      const steer = new THREE.Group();
      steer.position.set(w.x, w.size.radius, w.z);
      if (w.z < 0) built.group.rotation.y = Math.PI;
      steer.add(built.group);
      root.add(steer);
      wheels.push({
        steer,
        spin: built.spin,
        isFront: w.steer,
        radius: w.size.radius,
        // left-hand wheels are turned around so the rim faces out, which also
        // reverses their local spin axis
        flip: w.z < 0 ? -1 : 1,
      });

      const liner = P.archLiner(
        THREE,
        mats.liner,
        (w.x > 0 ? B.ARCHES[0].r : B.ARCHES[1].r) + 0.028,
        w.size.halfWidth + 0.005
      );
      liner.position.set(w.x, (w.x > 0 ? B.ARCHES[0].cy : B.ARCHES[1].cy), w.z);
      if (w.z < 0) liner.rotation.y = Math.PI;
      chassis.add(liner);
    });

    return { root, chassis, wheels, wing, lamps: { drl, tailBar }, shell };
  }

  global.CAR = { makeMaterials, buildCar, PAINTS };
})(window);

</script>
<script>
/* Studio: renderer, lighting rig, camera work, and the controls that drive
   the car rig. */
(function () {
  'use strict';

  const THREE = window.THREE;
  const { clamp, lerp, damp, smoothstep } = MX;

  const VIEWS = [
    { id: 'fq', cn: '前 3/4', k: 'FRONT 3/4', theta: -38, phi: 13, r: 9.4, fov: 30 },
    { id: 'rq', cn: '后 3/4', k: 'REAR 3/4', theta: -146, phi: 15, r: 9.6, fov: 30 },
    { id: 'side', cn: '侧视', k: 'SIDE', theta: -90, phi: 2.5, r: 17.5, fov: 16 },
    { id: 'front', cn: '前视', k: 'FRONT', theta: 0, phi: 5, r: 17.5, fov: 16 },
    { id: 'rear', cn: '后视', k: 'REAR', theta: 180, phi: 5, r: 17.5, fov: 16 },
    { id: 'top', cn: '俯视', k: 'TOP', theta: -90, phi: 84, r: 18.5, fov: 16 },
  ];

  const dom = (id) => document.getElementById(id);
  const loader = dom('loader');
  const loaderMsg = dom('loader-msg');

  function fail(msg) {
    loader.classList.remove('done');
    loader.innerHTML = '<span class="eyebrow">无法启动展台</span><p class="fail">' + msg + '</p>';
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: dom('view'),
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance',
    });
  } catch (e) {
    fail('这台设备的浏览器没有可用的 WebGL 上下文，无法渲染实时三维场景。');
    return;
  }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.4, 240);

  /* ---- studio environment ------------------------------------------------ */
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envCache = {};

  function buildEnv(dark) {
    if (envCache[dark]) return envCache[dark];
    const s = new THREE.Scene();
    const room = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({
        side: THREE.BackSide,
        color: dark ? 0x0b0c10 : 0xa9adb5,
        roughness: 1,
        metalness: 0,
      })
    );
    room.scale.set(34, 17, 34);
    room.position.y = 6;
    s.add(room);

    const panel = (w, h, d, x, y, z, intensity, color, rx, ry) => {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({
          color: 0x000000,
          emissive: new THREE.Color(color),
          emissiveIntensity: intensity,
          roughness: 1,
        })
      );
      m.position.set(x, y, z);
      if (rx) m.rotation.x = rx;
      if (ry) m.rotation.y = ry;
      s.add(m);
      return m;
    };

    // two long overhead strips give the body its stretched highlight
    panel(24, 0.2, 3.6, 0, 11.5, 3.8, dark ? 7 : 8.5, 0xffffff);
    panel(24, 0.2, 3.0, 0, 11.5, -3.6, dark ? 5.5 : 6.5, 0xfff4e6);
    // key softbox, high and forward
    panel(10, 7, 0.2, 9, 8, 7, dark ? 4 : 4.6, 0xffffff, -0.5, -0.6);
    // side fills shape the flanks
    panel(16, 7, 0.2, 0, 4.5, 12, dark ? 1.6 : 3.2, 0xdfe8ff);
    panel(16, 7, 0.2, 0, 4.5, -12, dark ? 1.2 : 2.6, 0xfff0dd);
    // low rim from behind picks out the rear haunches
    panel(8, 3, 0.2, -13, 2.6, 0, dark ? 3.2 : 2.4, 0xbfd4ff, 0, 1.57);
    // ground bounce
    panel(26, 0.2, 20, 0, -0.4, 0, dark ? 0.35 : 1.5, 0xffffff);

    const tex = pmrem.fromScene(s, 0.03).texture;
    s.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
    envCache[dark] = tex;
    return tex;
  }

  /* ---- floor, backdrop, contact shadow ---------------------------------- */
  const floorTex = TX.toTexture(THREE, TX.floorCanvas(512, '#ffffff', '#b7babf'), { srgb: true });
  floorTex.wrapS = floorTex.wrapT = THREE.ClampToEdgeWrapping;
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0xe8e9eb,
    map: floorTex,
    roughness: 0.62,
    metalness: 0,
    envMapIntensity: 0.55,
  });
  const floor = new THREE.Mesh(new THREE.CircleGeometry(70, 96), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  /* Cyclorama: an unlit gradient wall whose base colour is exactly the fog
     colour, so the floor dissolves into it and there is no horizon line. */
  const SKY = { light: '#e6e7ea', dark: '#0a0b0d' };
  const backTex = TX.toTexture(THREE, TX.backdropCanvas(SKY.light, '#c3c6cc', 0.5), { srgb: true });
  backTex.wrapS = backTex.wrapT = THREE.ClampToEdgeWrapping;
  const backMat = new THREE.MeshBasicMaterial({
    map: backTex,
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    // fog is composited after tone mapping, so the wall must skip tone mapping
    // too or the horizon shows as a step between wall and fogged floor
    toneMapped: false,
  });
  const backdrop = new THREE.Mesh(new THREE.CylinderGeometry(150, 150, 300, 48, 1, true), backMat);
  scene.add(backdrop);
  scene.fog = new THREE.Fog(0xe6e7ea, 17, 44);

  const blobTex = TX.toTexture(THREE, TX.blobCanvas(512));
  blobTex.wrapS = blobTex.wrapT = THREE.ClampToEdgeWrapping;
  const blobMat = new THREE.MeshBasicMaterial({
    map: blobTex,
    transparent: true,
    opacity: 0.55,
    color: 0x000000,
    depthWrite: false,
  });
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 3.3), blobMat);
  blob.rotation.x = -Math.PI / 2;
  blob.position.y = 0.004;
  blob.renderOrder = 1;
  scene.add(blob);

  /* ---- key light --------------------------------------------------------- */
  const key = new THREE.DirectionalLight(0xffffff, 1.9);
  key.position.set(5.5, 9, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 2;
  key.shadow.camera.far = 26;
  key.shadow.camera.left = -4.2;
  key.shadow.camera.right = 4.2;
  key.shadow.camera.top = 4.2;
  key.shadow.camera.bottom = -4.2;
  key.shadow.bias = -0.0008;
  key.shadow.normalBias = 0.018;
  scene.add(key);
  scene.add(key.target);

  const fill = new THREE.DirectionalLight(0xcfe0ff, 0.35);
  fill.position.set(-7, 4, -6);
  scene.add(fill);

  /* ---- theme ------------------------------------------------------------- */
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  let themeOverride = null;

  function isDark() {
    if (themeOverride) return themeOverride === 'dark';
    return mq.matches;
  }

  function applyTheme() {
    const dark = isDark();
    scene.environment = buildEnv(dark);
    scene.background = new THREE.Color(dark ? 0x0a0b0d : 0xe6e7ea);
    scene.fog.color.setHex(dark ? 0x0a0b0d : 0xe6e7ea);
    floorMat.color.setHex(dark ? 0x15171b : 0xe9eaec);
    backMat.map = TX.toTexture(
      THREE,
      TX.backdropCanvas(dark ? SKY.dark : SKY.light, dark ? '#1b1e24' : '#c3c6cc', 0.5),
      { srgb: true }
    );
    backMat.map.wrapS = backMat.map.wrapT = THREE.ClampToEdgeWrapping;
    backMat.needsUpdate = true;
    blobMat.opacity = dark ? 0.72 : 0.55;
    key.intensity = dark ? 1.5 : 1.9;
    fill.intensity = dark ? 0.22 : 0.35;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }
  mq.addEventListener('change', () => {
    if (!themeOverride) applyTheme();
  });

  /* ---- camera rig -------------------------------------------------------- */
  const rig = {
    theta: (VIEWS[0].theta * Math.PI) / 180,
    phi: (VIEWS[0].phi * Math.PI) / 180,
    r: VIEWS[0].r,
    fov: VIEWS[0].fov,
  };
  const goal = Object.assign({}, rig);
  const target = new THREE.Vector3(0, 0.62, 0);
  let snap = true;

  /* The control rail covers part of the canvas, so the car is nudged off the
     geometric centre to sit centred in what the viewer actually sees. */
  let frameForUI = true;
  const _right = new THREE.Vector3();
  const _up = new THREE.Vector3();
  const _off = new THREE.Vector3();
  const _look = new THREE.Vector3();

  function placeCamera() {
    const cp = Math.cos(rig.phi);
    camera.position.set(
      target.x + rig.r * cp * Math.cos(rig.theta),
      target.y + rig.r * Math.sin(rig.phi),
      target.z + rig.r * cp * Math.sin(rig.theta)
    );
    camera.fov = rig.fov;
    camera.updateProjectionMatrix();
    camera.lookAt(target);
    if (!frameForUI) return;
    const h = Math.max(1, window.innerHeight);
    const perPx = (2 * rig.r * Math.tan((rig.fov * Math.PI) / 360)) / h;
    const narrow = window.innerWidth <= 860;
    const dx = narrow ? 0 : 153 * perPx;
    const dy = narrow ? -h * 0.24 * perPx : 0;
    camera.updateMatrixWorld(true);
    _right.setFromMatrixColumn(camera.matrixWorld, 0);
    _up.setFromMatrixColumn(camera.matrixWorld, 1);
    _off.copy(_right).multiplyScalar(dx).addScaledVector(_up, dy);
    camera.position.add(_off);
    _look.copy(target).add(_off);
    camera.lookAt(_look);
  }

  function setView(v, immediate) {
    goal.theta = (v.theta * Math.PI) / 180;
    goal.phi = (v.phi * Math.PI) / 180;
    goal.r = v.r;
    goal.fov = v.fov;
    if (immediate) {
      Object.assign(rig, goal);
      placeCamera();
    }
  }

  /* pointer orbit */
  const canvas = renderer.domElement;
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  let pinch = 0;

  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch' && e.isPrimary === false) return;
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    goal.theta -= (e.clientX - lastX) * 0.0055;
    goal.phi = clamp(goal.phi + (e.clientY - lastY) * 0.0045, -0.06, 1.49);
    lastX = e.clientX;
    lastY = e.clientY;
  });
  const endDrag = () => {
    dragging = false;
    canvas.classList.remove('dragging');
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      goal.r = clamp(goal.r * (1 + e.deltaY * 0.0012), 4.2, 26);
    },
    { passive: false }
  );
  canvas.addEventListener(
    'touchmove',
    (e) => {
      if (e.touches.length !== 2) return;
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (pinch) goal.r = clamp(goal.r * (pinch / d), 4.2, 26);
      pinch = d;
    },
    { passive: true }
  );
  canvas.addEventListener('touchend', () => {
    pinch = 0;
  });

  /* ---- state ------------------------------------------------------------- */
  const state = {
    speedTarget: 0,
    speed: 0,
    prevSpeed: 0,
    braking: false,
    wing: 0,
    steerOn: false,
    steerPhase: 0,
    autoRotate: true,
    tour: false,
    tourTimer: 0,
    tourIndex: 0,
    lamps: true,
    view: VIEWS[0],
    spinAngle: 0,
  };

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) state.autoRotate = false;

  /* ---- build the car ----------------------------------------------------- */
  let car = null;
  let mats = null;

  function build() {
    mats = CAR.makeMaterials(THREE);
    car = CAR.buildCar(THREE, mats);
    scene.add(car.root);
    window.__car = car;
    car.root.add(blob);
    key.target.position.set(0, 0.5, 0);
    applyPaint(0);
  }

  function applyPaint(i) {
    const p = CAR.PAINTS[i];
    mats.paint.color.setHex(p.color);
    mats.paint.metalness = p.metal;
    mats.paint.roughness = p.rough;
    dom('paint-cn').textContent = p.name;
    dom('paint-en').textContent = p.en.toUpperCase();
  }

  /* ---- UI ---------------------------------------------------------------- */
  function buildUI() {
    const viewWrap = dom('views');
    const viewButtons = [];
    VIEWS.forEach((v, i) => {
      const b = document.createElement('button');
      b.innerHTML = v.cn + '<span class="k">' + (i + 1) + '</span>';
      b.setAttribute('aria-pressed', String(i === 0));
      b.addEventListener('click', () => selectView(i));
      viewWrap.appendChild(b);
      viewButtons.push(b);
    });

    function selectView(i, immediate) {
      state.view = VIEWS[i];
      setView(VIEWS[i], !!immediate);
      viewButtons.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
      if (state.autoRotate) toggleSpin(false);
    }

    const paintWrap = dom('paints');
    const paintButtons = [];
    CAR.PAINTS.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = '#' + p.color.toString(16).padStart(6, '0');
      b.title = p.name + ' / ' + p.en;
      b.setAttribute('aria-label', p.name);
      b.setAttribute('aria-pressed', String(i === 0));
      b.addEventListener('click', () => {
        applyPaint(i);
        paintButtons.forEach((x, k) => x.setAttribute('aria-pressed', String(k === i)));
      });
      paintWrap.appendChild(b);
      paintButtons.push(b);
    });

    const speed = dom('speed');
    speed.addEventListener('input', () => {
      state.speedTarget = +speed.value;
      dom('speed-val').textContent = speed.value;
    });

    const brake = dom('brake');
    const setBrake = (on) => {
      state.braking = on;
      brake.setAttribute('aria-pressed', String(on));
    };
    brake.addEventListener('pointerdown', () => setBrake(true));
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) =>
      brake.addEventListener(ev, () => setBrake(false))
    );
    brake.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') setBrake(true);
    });
    brake.addEventListener('keyup', () => setBrake(false));

    const spinBtn = dom('spin');
    function toggleSpin(on) {
      state.autoRotate = on;
      spinBtn.setAttribute('aria-pressed', String(on));
    }
    spinBtn.addEventListener('click', () => toggleSpin(!state.autoRotate));
    toggleSpin(state.autoRotate);
    window.__toggleSpin = toggleSpin;

    const steerBtn = dom('steer');
    steerBtn.addEventListener('click', () => {
      state.steerOn = !state.steerOn;
      steerBtn.setAttribute('aria-pressed', String(state.steerOn));
    });

    const lampBtn = dom('lamps');
    lampBtn.addEventListener('click', () => {
      state.lamps = !state.lamps;
      lampBtn.setAttribute('aria-pressed', String(state.lamps));
    });

    const tourBtn = dom('tour');
    tourBtn.addEventListener('click', () => {
      state.tour = !state.tour;
      state.tourTimer = 0;
      state.tourIndex = 0;
      tourBtn.setAttribute('aria-pressed', String(state.tour));
      if (state.tour) toggleSpin(false);
    });

    const exposure = dom('exposure');
    exposure.addEventListener('input', () => {
      renderer.toneMappingExposure = +exposure.value;
      dom('exposure-val').textContent = (+exposure.value).toFixed(2);
    });

    dom('theme').addEventListener('click', () => {
      themeOverride = isDark() ? 'light' : 'dark';
      applyTheme();
    });

    dom('reset').addEventListener('click', () => {
      state.speedTarget = 0;
      speed.value = 0;
      dom('speed-val').textContent = '0';
      state.steerOn = false;
      steerBtn.setAttribute('aria-pressed', 'false');
      state.tour = false;
      tourBtn.setAttribute('aria-pressed', 'false');
      selectView(0);
      toggleSpin(true);
      car.root.rotation.y = 0;
    });

    dom('shot').addEventListener('click', exportSheet);

    window.addEventListener('keydown', (e) => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 6) selectView(n - 1);
      if (e.key === ' ' && e.target === document.body) {
        e.preventDefault();
        toggleSpin(!state.autoRotate);
      }
    });

    let hintTimer = setTimeout(() => {
      dom('hint').style.opacity = '0';
    }, 9000);
    canvas.addEventListener('pointerdown', () => {
      clearTimeout(hintTimer);
      dom('hint').style.opacity = '0';
    });

    window.__selectView = selectView;
  }

  /* ---- six-view contact sheet -------------------------------------------- */
  function exportSheet() {
    const cw = 1120;
    const ch = 760;
    const cols = 3;
    const rows = 2;
    const out = document.createElement('canvas');
    out.width = cw * cols;
    out.height = ch * rows;
    const ctx = out.getContext('2d');
    const dark = isDark();
    ctx.fillStyle = dark ? '#0a0b0d' : '#e6e7ea';
    ctx.fillRect(0, 0, out.width, out.height);

    const savedRig = Object.assign({}, rig);
    const savedRot = car.root.rotation.y;
    const savedRatio = renderer.getPixelRatio();
    const size = new THREE.Vector2();
    renderer.getSize(size);

    car.root.rotation.y = 0;
    frameForUI = false;
    renderer.setPixelRatio(1);
    renderer.setSize(cw, ch, false);
    camera.aspect = cw / ch;

    VIEWS.forEach((v, i) => {
      setView(v, true);
      renderer.render(scene, camera);
      const x = (i % cols) * cw;
      const y = Math.floor(i / cols) * ch;
      ctx.drawImage(renderer.domElement, x, y);
      ctx.fillStyle = dark ? 'rgba(233,236,241,0.72)' : 'rgba(15,18,22,0.6)';
      ctx.font = '600 22px "Saira Condensed", sans-serif';
      ctx.fillText(v.cn + '  ·  ' + v.k, x + 34, y + ch - 32);
    });

    ctx.fillStyle = dark ? 'rgba(233,236,241,0.5)' : 'rgba(15,18,22,0.45)';
    ctx.font = '600 24px "Saira Condensed", sans-serif';
    ctx.fillText('NOCTIS R1 PROTOTIPO · SIX-VIEW STUDY', 34, 44);

    renderer.setPixelRatio(savedRatio);
    frameForUI = true;
    resize();
    Object.assign(rig, savedRig);
    Object.assign(goal, savedRig);
    car.root.rotation.y = savedRot;
    placeCamera();

    out.toBlob((b) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'noctis-r1-six-view.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  }

  /* ---- loop -------------------------------------------------------------- */
  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  const clock = new THREE.Clock();
  const fmt = (v) => Math.round(v).toString();

  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);

    if (state.tour) {
      state.tourTimer += dt;
      if (state.tourTimer > 3.4) {
        state.tourTimer = 0;
        state.tourIndex = (state.tourIndex + 1) % VIEWS.length;
        window.__selectView(state.tourIndex);
        state.tour = true;
        dom('tour').setAttribute('aria-pressed', 'true');
      }
    }

    // drivetrain
    const wanted = state.braking ? 0 : state.speedTarget;
    state.speed = damp(state.speed, wanted, state.braking ? 1.9 : 0.6, dt);
    const accel = (state.speed - state.prevSpeed) / Math.max(dt, 1e-3);
    state.prevSpeed = state.speed;

    const v = state.speed;
    const wingTarget = state.braking && v > 40 ? 0.95 : smoothstep((v - 70) / 140) * 0.16;
    state.wing = damp(state.wing, wingTarget, 5, dt);
    car.wing.rotation.z = state.wing;
    car.wing.position.y = 1.05 + state.wing * 0.1;

    const ride = smoothstep(v / 260) * 0.03;
    car.chassis.position.y = -ride;
    car.chassis.rotation.z = clamp(-accel * 0.0012, -0.012, 0.012);

    state.spinAngle -= ((v / 3.6) * dt) / 0.36;
    state.steerPhase += dt;
    const steerAngle = state.steerOn ? Math.sin(state.steerPhase * 0.8) * 0.42 : 0;
    car.wheels.forEach((w) => {
      w.spin.rotation.z = state.spinAngle * (0.36 / w.radius) * w.flip;
      if (w.isFront) w.steer.rotation.y = damp(w.steer.rotation.y, steerAngle, 6, dt);
    });

    // lamps
    const lampOn = state.lamps ? 1 : 0;
    mats.lampWhite.emissiveIntensity = damp(
      mats.lampWhite.emissiveIntensity,
      lampOn * 3.4,
      8,
      dt
    );
    const brakeGlow = state.braking ? 6.5 : 2.4;
    mats.lampRed.emissiveIntensity = damp(
      mats.lampRed.emissiveIntensity,
      lampOn * brakeGlow,
      10,
      dt
    );

    if (state.autoRotate && !dragging) car.root.rotation.y += dt * 0.16;

    // camera easing
    if (snap) {
      Object.assign(rig, goal);
      snap = false;
    } else {
      rig.theta = damp(rig.theta, goal.theta, 5, dt);
      rig.phi = damp(rig.phi, goal.phi, 5, dt);
      rig.r = damp(rig.r, goal.r, 5, dt);
      rig.fov = damp(rig.fov, goal.fov, 5, dt);
    }
    placeCamera();

    // telemetry
    const gear = clamp(Math.floor(v / 47), 0, 6);
    const rpm = v < 1 ? 820 : 1500 + ((v - gear * 47) / 47) * 7200;
    const df = 0.0135 * v * v * (1 + state.wing * 0.5);
    dom('t-speed').innerHTML = fmt(v) + '<i>km/h</i>';
    dom('t-rpm').innerHTML = fmt(rpm) + '<i>rpm</i>';
    dom('t-wing').innerHTML = fmt((state.wing * 180) / Math.PI) + '<i>°</i>';
    dom('t-df').innerHTML = fmt(df) + '<i>kg</i>';
    dom('t-ride').innerHTML = fmt(124 - ride * 1000) + '<i>mm</i>';
    dom('telemetry').classList.toggle('alert', state.braking);

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  /* ---- boot -------------------------------------------------------------- */
  applyTheme();
  resize();
  placeCamera();

  requestAnimationFrame(() => {
    loaderMsg.textContent = '正在生成车身曲面';
    requestAnimationFrame(() => {
      try {
        const t0 = performance.now();
        build();
        buildUI();
        window.__buildMs = Math.round(performance.now() - t0);
        loader.classList.add('done');
        tick();
      } catch (err) {
        fail('生成三维场景时出错：' + (err && err.message ? err.message : err));
        throw err;
      }
    });
  });
})();

</script>
